[pytest]
# O CI invoca `pytest` diretamente. Ao contrário de `python -m pytest`, essa
# forma não coloca o diretório atual no sys.path — e como `tests/` não é um
# pacote, o pytest insere `tests/` e não a raiz do repositório. O resultado é
# que `tests/conftest.py` falha em `from app.db import ...` com
# `ModuleNotFoundError: No module named 'app'`, e o pytest sai com código 4
# (erro de uso, não teste reprovado).
#
# Declarar a raiz aqui torna a suíte independente da forma de invocação:
# funciona igual em `pytest`, `python -m pytest` e em qualquer runner de IDE.
pythonpath = .
