<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia — Sistema de Gestão</title>
<style>
:root{
  --ouro:#C9A227; --ouro-claro:#E8C766; --preto:#0D0D0F; --carvao:#17171B;
  --grafite:#222228; --borda:#2E2E36; --texto:#EDEAE0; --texto-suave:#9B9788;
  --verde:#3FA86A; --vermelho:#C74A4A; --azul:#4A7FC7;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--preto);color:var(--texto);min-height:100vh}
button{cursor:pointer;font:inherit}
input,select{background:var(--grafite);border:1px solid var(--borda);color:var(--texto);
  padding:9px 12px;border-radius:8px;font-size:14px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--ouro)}
label{font-size:12px;color:var(--texto-suave);display:block;margin:10px 0 4px}
.btn{background:linear-gradient(135deg,var(--ouro),#A8871F);color:#141414;border:none;
  padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px}
.btn:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;border:1px solid var(--borda);color:var(--texto);
  padding:8px 14px;border-radius:8px;font-size:13px}
.btn-ghost:hover{border-color:var(--ouro);color:var(--ouro-claro)}
.btn-mini{padding:4px 10px;font-size:12px;border-radius:6px;border:1px solid var(--borda);
  background:var(--grafite);color:var(--texto)}
.btn-mini:hover{border-color:var(--ouro)}

/* login */
#tela-login{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:radial-gradient(ellipse at top,#1D1A12 0%,var(--preto) 60%)}
.cartao-login{background:var(--carvao);border:1px solid var(--borda);border-radius:16px;
  padding:40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.cartao-login h1{font-size:22px;text-align:center;color:var(--ouro-claro);letter-spacing:1px}
.cartao-login p.sub{text-align:center;color:var(--texto-suave);font-size:13px;margin:6px 0 18px}
.logo-circulo{width:64px;height:64px;border-radius:50%;border:2px solid var(--ouro);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:28px}
.dica{margin-top:16px;font-size:11px;color:var(--texto-suave);line-height:1.7;
  background:var(--grafite);border-radius:8px;padding:10px}

/* layout */
#tela-app{display:none;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--carvao);border-right:1px solid var(--borda);padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.marca{padding:0 20px 16px;border-bottom:1px solid var(--borda);margin-bottom:12px}
.marca h2{font-size:16px;color:var(--ouro-claro)}
.marca span{font-size:11px;color:var(--texto-suave)}
nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--texto-suave);
  padding:11px 20px;font-size:14px;border-left:3px solid transparent}
nav button:hover{color:var(--texto);background:var(--grafite)}
nav button.ativo{color:var(--ouro-claro);border-left-color:var(--ouro);background:var(--grafite)}
main{padding:28px 34px;max-width:1180px}
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.topo h1{font-size:22px}
.usuario-chip{font-size:13px;color:var(--texto-suave)}
.usuario-chip b{color:var(--texto)}

/* componentes */
.grade-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--carvao);border:1px solid var(--borda);border-radius:12px;padding:16px}
.kpi .rotulo{font-size:12px;color:var(--texto-suave)}
.kpi .valor{font-size:24px;font-weight:800;color:var(--ouro-claro);margin-top:4px}
.painel{background:var(--carvao);border:1px solid var(--borda);border-radius:12px;padding:20px;margin-bottom:20px}
.painel h3{font-size:15px;margin-bottom:14px;color:var(--ouro-claro)}
.tabela-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--texto-suave);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--borda);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #1F1F25;vertical-align:middle}
tr:hover td{background:#1B1B20}
.selo{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.s-agendado{background:#2A3A55;color:#9FC0F0}.s-confirmado{background:#1E3A2A;color:#7FD8A4}
.s-atrasado{background:#4A3A1E;color:#E8C766}.s-atendido{background:#3A2A4A;color:#C9A6E8}
.s-pago{background:#1E3A2A;color:#7FD8A4}.s-cancelado{background:#4A2222;color:#E89999}
.s-no_show{background:#3A3A3A;color:#AAA}.s-pendente{background:#4A3A1E;color:#E8C766}
.s-enviada{background:#1E3A2A;color:#7FD8A4}.s-erro{background:#4A2222;color:#E89999}
.linha-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.alerta{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.alerta.ok{background:#1E3A2A;color:#7FD8A4;display:block}
.alerta.erro{background:#4A2222;color:#E89999;display:block}
.abas-status{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.negativo{color:var(--vermelho)}.positivo{color:var(--verde)}
.dre-linha{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #1F1F25;font-size:14px}
.dre-linha.total{font-weight:800;color:var(--ouro-claro);border-top:2px solid var(--borda)}
.dre-linha .sub{color:var(--texto-suave);font-size:12px;padding-left:18px}
@media(max-width:860px){#tela-app{grid-template-columns:1fr}aside{position:static;height:auto}}
</style>
</head>
<body>

<div id="tela-login">
  <div class="cartao-login">
    <div class="logo-circulo">💈</div>
    <h1 id="login-titulo">SISTEMA BARBEARIA</h1>
    <p class="sub">Gestão · Estilo · Resultado</p>
    <div class="alerta" id="login-alerta"></div>
    <label>E-mail</label>
    <input id="login-email" type="email" placeholder="recepcao@prime.com">
    <label>Senha</label>
    <input id="login-senha" type="password" placeholder="••••••••">
    <button class="btn" style="width:100%;margin-top:18px" onclick="fazerLogin()">Entrar</button>
    <div class="dica">
      <b>Demonstração:</b><br>
      recepcao@prime.com · recepcao123 (balcão)<br>
      gerente@prime.com · gerente123 (gestão completa)<br>
      admin@plataforma.com · admin123 (plataforma white label)
    </div>
  </div>
</div>

<div id="tela-app">
  <aside>
    <div class="marca"><h2 id="marca-nome">Barbearia</h2><span>Sistema de gestão</span></div>
    <nav id="menu"></nav>
    <div style="padding:16px 20px"><button class="btn-ghost" style="width:100%" onclick="sair()">Sair</button></div>
  </aside>
  <main>
    <div class="topo">
      <h1 id="titulo-pagina">Dashboard</h1>
      <div class="usuario-chip">Logado como <b id="chip-nome"></b> · <span id="chip-papel"></span></div>
    </div>
    <div class="alerta" id="alerta-global"></div>
    <div id="conteudo"></div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
